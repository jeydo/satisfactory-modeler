<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planificateur d'usine — Satisfactory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D7DDE2; --grid:#B9C3CC; --panel:#EEF1F3; --panel2:#E1E6EA; --line:#C3CCD4;
  --text:#1C242C; --muted:#5A6773; --card:#FFFFFF; --cardtext:#1E252C; --cardmuted:#69717A; --cardline:#E3E6E9;
  --wire:#C4920A; --wiretext:#1C242C; --bad:#D2442F; --good:#2E8B5C; --focus:#2F6FD6;
  --altbg:#DDE7F6; --altline:#4C74B5; --altcard:#E4ECF8;
  --c-ext:#4F7A5A; --c-smelt:#A4552E; --c-build:#376797; --c-fluid:#714C8E; --c-log:#5F6872; --c-adv:#2F7C7A; --c-power:#9A7417;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A222A; --grid:#2B3641; --panel:#212A34; --panel2:#29343F; --line:#36434F;
    --text:#E4E8EB; --muted:#8E9BA7; --card:#ECE7DC; --cardtext:#1E252C; --cardmuted:#6A6F72; --cardline:#D8D2C5;
    --wire:#F2C230; --wiretext:#1E252C; --bad:#F0644E; --good:#62C08F; --focus:#7FB0FF; --altbg:#2D3B52; --altline:#5B84C8; --altcard:#DCE4F1;
  }
}
:root[data-theme="dark"]{
  --bg:#1A222A; --grid:#2B3641; --panel:#212A34; --panel2:#29343F; --line:#36434F;
  --text:#E4E8EB; --muted:#8E9BA7; --card:#ECE7DC; --cardtext:#1E252C; --cardmuted:#6A6F72; --cardline:#D8D2C5;
  --wire:#F2C230; --wiretext:#1E252C; --bad:#F0644E; --good:#62C08F; --focus:#7FB0FF; --altbg:#2D3B52; --altline:#5B84C8; --altcard:#DCE4F1;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-rows:auto 1fr}
/* top bar */
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#brand{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:20px;letter-spacing:.01em;margin-right:6px;white-space:nowrap}
#brand span{color:var(--muted);font-weight:500}
.tb{display:flex;align-items:center;gap:6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap;line-height:1.1}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--wire);border-color:var(--wire);color:var(--wiretext);font-weight:600}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.field{background:var(--card);color:var(--cardtext);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
#fname{width:200px;font-weight:600}
#status{color:var(--muted);font-size:12.5px;margin-left:auto;white-space:nowrap}
.mobile-only{display:none}

/* layout */
#main{display:grid;grid-template-columns:1fr 300px;min-height:0;position:relative}
aside{background:var(--panel);overflow:auto;min-height:0}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h2{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:17px;font-weight:600;margin:0 0 8px}
.sec h3{font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}
#search{width:100%}
.pal-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:5px 6px;border-radius:5px;cursor:pointer}
.pal-item:hover{background:var(--panel2)}
.pal-item small{color:var(--muted);margin-left:auto;font-size:11.5px}
.sw{width:9px;height:9px;border-radius:2px;flex:none}
.hint{color:var(--muted);font-size:12.5px;line-height:1.45}

/* canvas */
#canvas{position:relative;overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--bg);
  background-image:radial-gradient(circle,var(--grid) 1.2px,transparent 1.3px);background-size:24px 24px}
#canvas.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path.hit{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke;cursor:pointer}
#edges path.w{fill:none;stroke:var(--wire);stroke-width:3}
#edges path.w.fluid{stroke-dasharray:9 5}
#edges path.w.sel{stroke-width:5}
#edges path.w.over{stroke:var(--bad)}
#edges path.w.dead{opacity:.45}
#edges .lbl rect{fill:var(--wire)}
#edges .lbl.over rect{fill:var(--bad)}
#edges .lbl text{font:600 12px "Barlow Condensed",Barlow,sans-serif;fill:var(--wiretext)}
#edges .lbl.over text{fill:#fff}
#edges path.temp{fill:none;stroke:var(--wire);stroke-width:2.5;stroke-dasharray:6 5}

.node{position:absolute;left:0;top:0;background:var(--card);color:var(--cardtext);border-radius:7px;
  box-shadow:0 0 0 1px rgba(0,0,0,.18),0 6px 16px rgba(0,0,0,.22);user-select:none;-webkit-user-select:none}
.node.sel{box-shadow:0 0 0 2px var(--wire),0 8px 22px rgba(0,0,0,.3)}
.nh{height:30px;display:flex;align-items:center;gap:6px;padding:0 10px;color:#fff;border-radius:7px 7px 0 0;cursor:move}
.nh .nt{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nh .nc{margin-left:auto;font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:600;font-size:14px;opacity:.92;white-space:nowrap}
.cat-ext .nh{background:var(--c-ext)} .cat-smelt .nh{background:var(--c-smelt)} .cat-build .nh{background:var(--c-build)}
.cat-fluid .nh{background:var(--c-fluid)} .cat-adv .nh{background:var(--c-adv)} .cat-power .nh{background:var(--c-power)} .cat-log .nh{background:var(--c-log)}
.nr{height:22px;line-height:22px;padding:0 10px;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--cardline)}
.row{height:24px;display:grid;grid-template-columns:1fr 1fr}
.pin,.pout{position:relative;display:flex;align-items:center;gap:4px;min-width:0;font-size:12.5px;padding:0 10px}
.pout{justify-content:flex-end;text-align:right}
.pin .lab,.pout .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--cardmuted)}
.pin b,.pout b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.bad{color:var(--bad)!important} .sur{color:var(--good)!important}
.dot{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;border:2px solid var(--card);cursor:crosshair;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.dot::after{content:"";position:absolute;inset:-9px}
.pin .dot{left:-7px} .pout .dot{right:-7px}
.dot.fluid{border-radius:3px}
.dot.hot{transform:scale(1.35)}
.nf{height:22px;line-height:22px;padding:0 10px;font-size:12px;color:var(--cardmuted);border-top:1px solid var(--cardline);display:flex;gap:10px;font-variant-numeric:tabular-nums}
.nf .eff{margin-left:auto}

#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#empty div{pointer-events:auto;max-width:360px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
#empty h2{font-family:"Barlow Condensed",Barlow,sans-serif;margin:0 0 6px;font-size:22px}
#empty p{margin:0 0 14px;color:var(--muted);line-height:1.45}

#box{position:absolute;display:none;border:1.5px dashed var(--wire);background:color-mix(in srgb,var(--wire) 12%,transparent);pointer-events:none;z-index:5}
#zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
#zoom .btn{width:36px;height:36px;padding:0;font-size:17px}
#legend{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;max-width:calc(100% - 80px)}

/* quick menu */
#qm{position:absolute;z-index:20;width:350px;max-width:calc(100% - 8px);max-height:460px;display:none;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
#qm.open{display:flex}
#qm header{padding:8px 10px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
#qm header b{color:var(--text)}
#qm input{margin:8px 10px 4px}
#qm .list{overflow:auto;padding:4px 6px 8px}
#qm .list{overscroll-behavior:contain}
.qrow{display:grid;grid-template-columns:100px 1fr 50px;align-items:center;gap:6px;width:100%;margin:3px 0;padding:6px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;cursor:pointer;text-align:center}
.qrow:hover{border-color:var(--muted)}
.qrow .qn{font-weight:600;font-size:13.5px;line-height:1.2}
.qrow .qi{display:flex;gap:3px;justify-content:flex-start;flex-wrap:nowrap;overflow:hidden}
.qrow .qo{display:flex;gap:3px;justify-content:flex-end}
.qrow.alt{background:var(--altbg);border-color:var(--altline)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:9px;background:var(--altline);color:#fff;margin-left:5px;vertical-align:1px;letter-spacing:.02em}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;width:21px;height:21px;border-radius:4px;color:#fff;font:700 10px/1 "Barlow Condensed",Barlow,sans-serif;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.ic.fl{border-radius:50%}
.ic.img{background:none;box-shadow:none;object-fit:contain;width:24px;height:24px}
.ic.sm{width:17px;height:17px;font-size:8px;border-radius:3px}
.ic.hd{width:22px;height:22px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.kv .ic{vertical-align:middle;margin-right:5px}
.qrow .ic.img{width:22px;height:22px}
.pin .ic,.pout .ic{flex:none}
.nr.alt{background:var(--altcard)}
.nr .tag{margin-left:6px}
.rates{display:grid;gap:5px}
.rrow{display:grid;grid-template-columns:44px 21px 1fr 74px auto;align-items:center;gap:6px;font-size:13px}
.rrow .rk{color:var(--muted);font-size:12px}
.rrow .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .ru{color:var(--muted);font-size:12px}
.rrow .field{width:74px;text-align:right;padding:5px 6px}
.lock{font-size:11px;background:rgba(255,255,255,.24);border-radius:3px;padding:1px 5px;margin-left:5px}
#qm .list h3{font-size:12px;font-weight:600;color:var(--muted);margin:10px 6px 2px}

/* right panel */
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.big{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:30px;font-weight:700;line-height:1}
.big small{font-size:15px;color:var(--muted);font-weight:500;margin-left:3px}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
label.f + .field,.fw{width:100%}
.inline{display:flex;gap:6px;align-items:center}
.inline input[type=range]{flex:1;accent-color:var(--wire)}
.inline .field{width:76px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.empty-note{color:var(--muted);font-size:12.5px}

@media (max-width:860px){
  #main{grid-template-columns:1fr}
  aside{position:absolute;top:0;bottom:0;z-index:15;width:min(310px,88vw);box-shadow:0 0 30px rgba(0,0,0,.35);display:none}
  #left{left:0} #right{right:0}
  aside.open{display:block}
  .mobile-only{display:inline-block}
  #fname{width:140px}
  #status{display:none}
  #legend{display:none}
}
@media (prefers-reduced-motion:no-preference){ .btn{transition:border-color .12s} }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="brand">Planificateur <span>d'usine</span></div>
    <div class="tb">
      <input id="fname" class="field" aria-label="Nom de l'usine" value="Nouvelle usine">
      <select id="flist" class="field" aria-label="Mes usines" style="max-width:170px"></select>
      <button class="btn" id="bNew">Nouvelle</button>
    </div>
    <div class="tb">
      <button class="btn" id="bUndo" title="Annuler (Ctrl+Z)">Annuler</button>
      <button class="btn" id="bRedo" title="Rétablir (Ctrl+Y)">Rétablir</button>
    </div>
    <div class="tb">
      <button class="btn" id="bExport">Exporter</button>
      <button class="btn" id="bImport">Importer</button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </div>
    <button class="btn mobile-only" id="tglRight">Détails</button>
    <div id="status" class="num"></div>
  </header>
  <div id="main">
    <div id="canvas">
      <div id="world"><svg id="edges"></svg><div id="nodes"></div></div>
      <div id="empty"><div>
        <h2>Usine vide</h2>
        <p>Faites un clic droit dans le vide (ou touchez +) pour ajouter une ressource ou une machine, puis tirez un fil depuis une sortie pour enchaîner la suite.</p>
        <button class="btn primary" id="bExample">Charger un exemple</button>
      </div></div>
      <div id="legend">Clic droit : ajouter. Clic droit maintenu + glisser : sélection multiple. Ctrl+C / Ctrl+V : copier / coller.</div>
      <div id="box"></div>
      <div id="zoom">
        <button class="btn primary" id="zAdd" aria-label="Ajouter une machine" title="Ajouter une machine">＋</button>
        <button class="btn" id="zIn" aria-label="Zoomer">+</button>
        <button class="btn" id="zOut" aria-label="Dézoomer">−</button>
        <button class="btn" id="zFit" aria-label="Tout afficher" title="Tout afficher">⤢</button>
      </div>
      <div id="qm"><header id="qmHead"></header><input id="qmSearch" class="field" placeholder="Filtrer" autocomplete="off"><div class="list" id="qmList"></div></div>
    </div>
    <aside id="right">
      <div class="sec" id="props"></div>
      <div class="sec" id="summary"></div>
    </aside>
  </div>
</div>

function icon(item,cls=''){ if(ICONS[item]) return `<img class="ic img ${cls}" src="${ICONS[item]}" alt="" title="${esc(item)}" draggable="false">`; return `<span class="ic${isFluid(item)?' fl':''} ${cls}" style="background:${itemColor(item)}" title="${esc(item)}">${esc(abbr(item))}</span>` }
const ALL_ITEMS=[...new Set([...ORES,...WELL_RES,...RECIPE_DATA.flatMap(r=>[...r[2],...r[3]].map(x=>x[0]))])].sort();
const LOGI={source:'Entrée',sink:'Sortie',splitter:'Répartiteur',merger:'Fusionneur'};

/* ================= État ================= */
let state=blank();
let view={x:60,y:60,z:1};
let sel=null;            // {type:'node'|'edge', id} ou {type:'multi', ids:Set}
let clip=null, lastWorld=null;
function selIds(){ return !sel?[]: sel.type==='node'?[sel.id]: sel.type==='multi'?[...sel.ids]:[] }
function isSel(id){ return sel&&(sel.type==='node'?sel.id===id:sel.type==='multi'&&sel.ids.has(id)) }
function setSelIds(ids){ ids=[...new Set(ids)]; sel= !ids.length?null: ids.length===1?{type:'node',id:ids[0]}:{type:'multi',ids:new Set(ids)} }
let R=null;              // résultats du calcul
let hist=[],redo=[];
let fid=null;            // id du document enregistré
let uid=null, db=null, downloads=null;
const $=s=>document.querySelector(s);
const canvas=$('#canvas'), world=$('#world'), nodesEl=$('#nodes'), edgesEl=$('#edges');

function blank(){return {name:'Nouvelle usine',nodes:[],edges:[],seq:1}}
function nid(){return 'n'+(state.seq++)}
function eid(){return 'e'+(state.seq++)}
const fmtN=v=>{ const r=Math.round(v*100)/100; return r.toLocaleString('fr-FR',{minimumFractionDigits:Number.isInteger(r)?0:2,maximumFractionDigits:2}) };
function splitCount(c){ const full=Math.floor(c+1e-9), frac=Math.round((c-full)*1e4)/1e4; return {full,frac} }
function countText(c){ const {full,frac}=splitCount(c); const pct=fmt(frac*100);
  if(c<=0) return 'Aucune machine active';
  if(frac<1e-4) return `Soit ${full} machine${full>1?'s':''} à 100 %`;
  if(full===0) return `Soit 1 machine à ${pct} %`;
  return `Soit ${full} machine${full>1?'s':''} à 100 % et 1 à ${pct} %` }
const fmt=v=>{ if(!isFinite(v)) return '∞'; const r=Math.round(v*100)/100; return (Math.abs(r)<0.005?0:r).toLocaleString('fr-FR',{maximumFractionDigits:2}) };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isFluid=i=>FLUIDS.has(i);
function hue(item){let h=0;for(const c of item)h=(h*31+c.charCodeAt(0))%360;return h}
const itemColor=i=>i==='*'?'#8a8f96':`hsl(${hue(i)} 50% 42%)`;

/* ================= Modèle des nœuds ================= */
function catOf(n){ if(n.kind==='machine') return BUILD[RECIPES[n.recipe].b].cat; if(n.kind==='extractor') return 'ext'; return 'log' }
function widthOf(n){ return (n.kind==='machine'||n.kind==='extractor')?300:210 }
function extractorItem(n){ return n.b==='Water Extractor'?'Water':n.b==='Oil Extractor'?'Crude Oil':n.item }
const isGen=b=>BUILD[b]&&BUILD[b].cat==='power';
function extractorRate(n){ return BUILD[n.b].rate*(n.b==='Water Extractor'?1:PUR[n.purity||'normal']) }
function ports(n){
  if(n.kind==='machine'){ const r=RECIPES[n.recipe], k=n.count;
    return {ins:r.ins.map(([i,v])=>({item:i,rate:v*k})), outs:r.outs.map(([i,v])=>({item:i,rate:v*k}))} }
  if(n.kind==='extractor') return {ins:[],outs:[{item:extractorItem(n),rate:extractorRate(n)*n.count}]};
  if(n.kind==='source') return {ins:[],outs:[{item:n.item,rate:n.rate}]};
  if(n.kind==='sink') return {ins:[{item:'*',rate:Infinity}],outs:[]};
  if(n.kind==='splitter') return {ins:[{item:'*',rate:0}],outs:[{item:'*'},{item:'*'},{item:'*'}]};
  if(n.kind==='merger') return {ins:[{item:'*'},{item:'*'},{item:'*'}],outs:[{item:'*',rate:0}]};
}
function power(n){ let b=null, base;
  if(n.kind==='machine'){ const r=RECIPES[n.recipe]; b=r.b; base=r.pw??BUILD[b].p; if(base<0) return base*n.count }
  else if(n.kind==='extractor'){ b=n.b; base=BUILD[b].p } else return 0;
  const {full,frac}=splitCount(n.count); return base*(full+Math.pow(frac,1.321928)) }
function migrate(st){ for(const n of st.nodes){ if(n.kind==='machine'&&!RECIPES[n.recipe]&&ALIAS[n.recipe]) n.recipe=ALIAS[n.recipe]; if(n.clock!==undefined){ n.count=Math.round(n.count*n.clock/100*1e4)/1e4; delete n.clock } if(n.kind==='machine'&&n.manual===undefined) n.manual=false } delete st.belt; delete st.pipe; return st }
const isLogi=n=>n.kind==='splitter'||n.kind==='merger';

/* ================= Calcul des débits ================= */
const isAuto=n=>n.kind==='machine'&&!n.manual;
/* Optimisation par programmation linéaire :
   1) remplir d'abord les machines fixées à la main,
   2) maximiser les machines en bout de chaîne (part égale entre elles),
   3) maximiser ce qui sort en bout de chaîne,
   4) ne pas faire tourner de machine inutilement. */
function lpRun(model){ try{ const r=window.solver.Solve(model); return r&&r.feasible?r:null }catch(_){ return null } }
function solve(){
  const N=new Map(state.nodes.map(n=>[n.id,n]));
  state.edges=state.edges.filter(e=>N.has(e.from)&&N.has(e.to));
  const U={}; for(const n of state.nodes) U[n.id]=ports(n.kind==='machine'||n.kind==='extractor'?{...n,count:1}:n);
  const li={};
  const portItem=(id,side,i)=>{ const n=N.get(id); if(isLogi(n)) return li[id]||'*'; const p=U[id][side][i]; return p?p.item:'*' };
  for(let k=0;k<12;k++) for(const e of state.edges){
    const a=portItem(e.from,'outs',e.fp), b=portItem(e.to,'ins',e.tp);
    if(isLogi(N.get(e.from))&&!li[e.from]&&b!=='*') li[e.from]=b;
    if(isLogi(N.get(e.to))&&!li[e.to]&&a!=='*') li[e.to]=a;
  }
  const outEdges={}, inEdges={};
  for(const e of state.edges){ (outEdges[e.from]??=[]).push(e); (inEdges[e.to]??=[]).push(e) }
  // ---- modèle
  const V={}, C={}; const v=k=>V[k]??={};
  for(const e of state.edges) v('f'+e.id);
  const machines=state.nodes.filter(n=>n.kind==='machine');
  const terminals=machines.filter(n=>isAuto(n)&&(outEdges[n.id]||[]).every(e=>N.get(e.to).kind==='sink'));
  for(const n of state.nodes){
    const ie=inEdges[n.id]||[], oe=outEdges[n.id]||[];
    if(n.kind==='machine'){ const c=v('c'+n.id);
      C['ub'+n.id]={max: n.manual?Math.max(0,n.count):1e6}; c['ub'+n.id]=1;
      U[n.id].ins.forEach((p,i)=>{ const k=`i${n.id}_${i}`; C[k]={equal:0}; c[k]=-p.rate; for(const e of ie) if(e.tp===i) v('f'+e.id)[k]=1 });
      U[n.id].outs.forEach((p,j)=>{ const k=`o${n.id}_${j}`; C[k]={max:0}; c[k]=-p.rate; for(const e of oe) if(e.fp===j) v('f'+e.id)[k]=1 });
    } else if(n.kind==='extractor'||n.kind==='source'){
      const cap= n.kind==='source'?n.rate:extractorRate(n)*n.count; const k='o'+n.id; C[k]={max:Math.max(0,cap)}; for(const e of oe) v('f'+e.id)[k]=1;
    } else if(isLogi(n)){ const k='l'+n.id; C[k]={equal:0}; for(const e of ie) v('f'+e.id)[k]=1; for(const e of oe) v('f'+e.id)[k]=(v('f'+e.id)[k]||0)-1 }
  }
  const fix=(key,val,dir)=>{ const tol=1e-6*Math.max(1,Math.abs(val)); C[key]= dir==='max'?{min:val-tol}:{max:val+tol} };
  let res=null;
  const run=(key,dir)=>{ const r=lpRun({optimize:key,opType:dir,constraints:{...C},variables:V}); if(r){ res=r; fix(key,r.result||0,dir) } else { for(const k in V) delete V[k][key] } };
  const man=machines.filter(n=>n.manual&&n.count>0);
  if(man.length){ for(const n of man) v('c'+n.id).sA=1/n.count; run('sA','max') }
  if(terminals.length){ const z=v('z'); z.sB=1; for(const n of terminals){ const k='t'+n.id; C[k]={min:0}; v('c'+n.id)[k]=1; z[k]=-1 } run('sB','max') }
  for(const n of terminals){ const r0=U[n.id].outs[0]?.rate||1; v('c'+n.id).sC=(v('c'+n.id).sC||0)+r0 }
  for(const e of state.edges) if(N.get(e.to).kind==='sink') v('f'+e.id).sC=(v('f'+e.id).sC||0)+1;
  if(Object.values(V).some(x=>x.sC)) run('sC','max');
  for(const n of machines) if(isAuto(n)) v('c'+n.id).sD=1;
  for(const e of state.edges) v('f'+e.id).sD=(v('f'+e.id).sD||0)+1e-3;
  run('sD','min');
  if(!res) res=lpRun({optimize:'sD',opType:'min',constraints:C,variables:V})||{};
  const val=k=>{ const x=+res[k]||0; return Math.abs(x)<1e-9?0:x };
  // ---- résultats
  const flow={}, sup={}, eff={}, avail={}, used={};
  for(const e of state.edges) flow[e.id]=val('f'+e.id);
  for(const n of state.nodes){
    sup[n.id]=U[n.id].ins.map((_,i)=>(inEdges[n.id]||[]).filter(e=>e.tp===i).reduce((s,e)=>s+flow[e.id],0));
    used[n.id]=U[n.id].outs.map((_,j)=>(outEdges[n.id]||[]).filter(e=>e.fp===j).reduce((s,e)=>s+flow[e.id],0));
    if(n.kind==='machine'){ const c=Math.round(val('c'+n.id)*1e6)/1e6;
      if(isAuto(n)){ n.count=c; eff[n.id]=1 } else eff[n.id]= n.count>0?Math.min(1,c/n.count):1;
      avail[n.id]=U[n.id].outs.map(p=>p.rate*c);
    } else if(isLogi(n)){ const pool=sup[n.id].reduce((a,b)=>a+b,0); avail[n.id]=U[n.id].outs.map((_,j)=>j===0?pool:0); used[n.id]=U[n.id].outs.map((_,j)=>j===0?used[n.id].reduce((a,b)=>a+b,0):0); eff[n.id]=1 }
    else { avail[n.id]=ports(n).outs.map(p=>p.rate); eff[n.id]=1 }
  }
  const P={}; for(const n of state.nodes) P[n.id]=ports(n);
  R={P,li,flow,sup,eff,avail,used,portItem,terminals:new Set(terminals.map(n=>n.id))};
}

/* ================= Rendu ================= */
function applyView(){ world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.z})` }
function portPos(n,side,i){ return {x:n.x+(side==='ins'?0:widthOf(n)), y:n.y+52+i*24+12} }

function nodeHTML(n){
  const P=R.P[n.id], rows=Math.max(P.ins.length,P.outs.length,1), cat=catOf(n), e=R.eff[n.id];
  let title, count='', sub; const alt=n.kind==='machine'&&RECIPES[n.recipe].alt;
  if(n.kind==='machine'){ const r=RECIPES[n.recipe]; title=r.b; count=`×${fmtN(n.count)}`; sub=r.name }
  else if(n.kind==='extractor'){ title=n.b; count=`×${fmtN(n.count)}`; sub=extractorItem(n)+(n.b==='Water Extractor'?'':` · nœud ${PURFR[n.purity||'normal']}`) }
  else { title=LOGI[n.kind]; sub= n.kind==='source'?n.item : (R.li[n.id]||(n.kind==='sink'?'Produits finis':'Tout objet')) }
  const bIcon= n.kind==='machine'?RECIPES[n.recipe].b : n.kind==='extractor'?n.b : null;
  let h=`<div class="nh">${bIcon&&ICONS[bIcon]?icon(bIcon,'hd'):''}<span class="nt">${esc(title)}</span><span class="nc num">${esc(count)}${n.kind==='machine'&&n.manual?'<span class="lock" title="Nombre fixé à la main">fixé</span>':''}</span></div><div class="nr${alt?' alt':''}">${esc(sub)}${alt?'<span class="tag">Alternative</span>':''}</div>`;
  for(let r=0;r<rows;r++){
    h+='<div class="row">';
    const pi=P.ins[r];
    if(pi){ const item=R.portItem(n.id,'ins',r); const s=R.sup[n.id][r];
      const lacking = pi.rate!==Infinity && n.kind==='machine' && s<pi.rate-0.01;
      const txt = n.kind==='machine'? `${fmt(s)}/${fmt(pi.rate)}` : fmt(s);
      h+=`<div class="pin"><i class="dot${isFluid(item)?' fluid':''}" style="background:${itemColor(item)}" data-port="${n.id}|ins|${r}" title="${esc(item==='*'?'Tout objet':item)}"></i>${item!=='*'?icon(item,'sm'):''}<span class="lab">${esc(item==='*'?'Entrée':item)}</span><b class="${lacking?'bad':''}">${txt}</b></div>`;
    } else h+='<div></div>';
    const po=P.outs[r];
    if(po){ const item=R.portItem(n.id,'outs',r); const av=R.avail[n.id][r]||0, u=R.used[n.id][r]||0;
      const surplus = !isLogi(n) && av-u>0.01;
      const linked=state.edges.some(e=>e.from===n.id&&e.fp===r); const txt = isLogi(n)? fmt(u) : linked?`${fmt(u)}/${fmt(av)}`:fmt(av);
      h+=`<div class="pout"><b class="${surplus?'sur':''}" title="${surplus?'Excédent : '+fmt(av-u)+' /min':''}">${txt}</b><span class="lab">${esc(item==='*'?'Sortie':item)}</span>${item!=='*'?icon(item,'sm'):''}<i class="dot${isFluid(item)?' fluid':''}" style="background:${itemColor(item)}" data-port="${n.id}|outs|${r}" title="${esc(item==='*'?'Tout objet':item)}"></i></div>`;
    } else h+='<div></div>';
    h+='</div>';
  }
  if(n.kind==='machine'||n.kind==='extractor'){
    let st, bad=false;
    if(isAuto(n)){ if(n.count<1e-6){ st='En attente d\'entrée' } else if(R.terminals.has(n.id)) st='Production maximisée'; else st='Optimisé' }
    else if(e<0.999){ st='Efficacité '+Math.round(e*100)+' %'; bad=true } else st='Pleine cadence';
    const pwN=power(n);
    h+=`<div class="nf"><span>${pwN<0?'Produit '+fmt(-pwN):fmt(pwN)} MW</span><span class="eff ${bad?'bad':''}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(st)}</span></div>`;
  }
  return `<div class="node cat-${cat}${isSel(n.id)?' sel':''}" data-node="${n.id}" style="width:${widthOf(n)}px;transform:translate(${n.x}px,${n.y}px)">${h}</div>`;
}
function renderNodes(){ nodesEl.innerHTML=state.nodes.map(nodeHTML).join(''); $('#empty').style.display=state.nodes.length?'none':'flex' }
function curve(a,b){ const dx=Math.max(50,Math.abs(b.x-a.x)*0.5); return {d:`M${a.x},${a.y} C${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}`, mx:(a.x+3*(a.x+dx)+3*(b.x-dx)+b.x)/8, my:(a.y+b.y)/2} }
let tempWire='';
function renderEdges(){
  const N=new Map(state.nodes.map(n=>[n.id,n]));
  let h='';
  for(const e of state.edges){ const a=N.get(e.from), b=N.get(e.to); if(!a||!b) continue;
    const c=curve(portPos(a,'outs',e.fp),portPos(b,'ins',e.tp));
    const item=R.portItem(e.from,'outs',e.fp); const fl=isFluid(item);
    const f=R.flow[e.id]||0, over=false;
    const s=sel&&sel.type==='edge'&&sel.id===e.id;
    h+=`<path class="w${fl?' fluid':''}${over?' over':''}${f<1e-6?' dead':''}${s?' sel':''}" d="${c.d}"/>`;
    h+=`<path class="hit" data-edge="${e.id}" d="${c.d}"><title>${esc(item)} : ${fmt(f)} /min</title></path>`;
    const t=fmt(f)+(over?' !':''), w=t.length*6.6+12;
    h+=`<g class="lbl${over?' over':''}" transform="translate(${c.mx},${c.my})"><rect x="${-w/2}" y="-9" width="${w}" height="18" rx="4"/><text text-anchor="middle" y="4">${t}</text></g>`;
  }
  edgesEl.innerHTML=h+tempWire;
}
function renderSummary(){
  let pw=0, prod=0; const ext={}, fin={}, miss={}, surplus={};
  for(const n of state.nodes){ const pp=power(n); if(pp<0) prod-=pp; else pw+=pp; const P=R.P[n.id];
    if(n.kind==='extractor'||n.kind==='source'){ const it=P.outs[0].item; ext[it]=(ext[it]||0)+R.avail[n.id][0] }
    if(n.kind==='machine'){ P.ins.forEach((p,i)=>{ const d=p.rate-R.sup[n.id][i]; if(d>0.01) miss[p.item]=(miss[p.item]||0)+d }) }
    if(!isLogi(n)) P.outs.forEach((p,j)=>{ const s=(R.avail[n.id][j]||0)-(R.used[n.id][j]||0); if(s>0.01) surplus[p.item]=(surplus[p.item]||0)+s });
  }
  for(const e of state.edges){ const n=state.nodes.find(x=>x.id===e.to); if(n&&n.kind==='sink'){ const it=R.portItem(e.from,'outs',e.fp); fin[it]=(fin[it]||0)+(R.flow[e.id]||0) } }
  const kv=(o,cls='')=>{ const k=Object.keys(o).sort(); return k.length?`<div class="kv">${k.map(i=>`<span>${icon(i,'sm')}${esc(i)}</span><span class="${cls}">${fmt(o[i])} /min</span>`).join('')}</div>`:'' };
  const machines=state.nodes.filter(n=>n.kind==='machine'||n.kind==='extractor').reduce((a,n)=>a+n.count,0);
  $('#summary').innerHTML=`<h2>Bilan de l'usine</h2>
   <div class="inline" style="gap:20px;margin-bottom:6px"><div class="big num">${fmt(pw)}<small>MW consommés</small></div><div class="big num">${fmt(machines)}<small>machines</small></div></div>
   ${prod>0?`<div class="big num" style="margin-bottom:6px;color:var(--good)">${fmt(prod)}<small>MW produits</small></div><div class="hint">Bilan : ${prod>=pw?'+':'−'}${fmt(Math.abs(prod-pw))} MW</div>`:''}
   <h3>Ressources extraites</h3>${kv(ext)||'<div class="empty-note">Aucun extracteur.</div>'}
   <h3>Envoyé vers les sorties</h3>${kv(fin)||'<div class="empty-note">Reliez un produit à un nœud Sortie pour le compter ici.</div>'}
   <h3>Excédents non consommés</h3>${kv(surplus,'sur')||'<div class="empty-note">Aucun.</div>'}
   <h3>Manques</h3>${kv(miss,'bad')||'<div class="empty-note">Toutes les entrées sont alimentées.</div>'}`;
}
function renderProps(){
  const el=$('#props');
  if(!sel){ el.innerHTML=`<h2>Sélection</h2><p class="hint">Cliquez sur une machine ou un fil pour voir ses réglages. Maintenez le clic droit et glissez pour sélectionner plusieurs machines.</p>${clip?`<div class="actions"><button class="btn" data-act="paste">Coller (${clip.nodes.length})</button></div>`:''}`; return }
  if(sel.type==='multi'){ const ids=selIds().filter(id=>state.nodes.some(n=>n.id===id)); if(ids.length<2){ setSelIds(ids); return renderProps() }
    const ns=state.nodes.filter(n=>sel.ids.has(n.id)); const pw=ns.reduce((a,n)=>a+Math.max(0,power(n)),0);
    el.innerHTML=`<h2>${ns.length} éléments sélectionnés</h2><div class="kv"><span>Consommation</span><span>${fmt(pw)} MW</span></div>
      <p class="hint">Glissez l'un d'eux pour tous les déplacer. Ctrl+C pour copier, Ctrl+V pour coller, Suppr pour effacer.</p>
      <div class="actions"><button class="btn" data-act="copy">Copier</button><button class="btn" data-act="dup">Dupliquer</button>${clip?`<button class="btn" data-act="paste">Coller</button>`:''}<button class="btn danger" data-act="del">Supprimer</button></div>`;
    return }
  if(sel.type==='edge'){ const e=state.edges.find(x=>x.id===sel.id); if(!e){sel=null;return renderProps()}
    const it=R.portItem(e.from,'outs',e.fp), fl=isFluid(it);
    el.innerHTML=`<h2>${fl?'Tuyau':'Convoyeur'}</h2><div class="kv"><span>Objet</span><span>${esc(it)}</span><span>Débit</span><span>${fmt(R.flow[e.id])} /min</span></div><div class="actions"><button class="btn danger" data-act="del">Supprimer le fil</button></div>`;
    return }
  const n=state.nodes.find(x=>x.id===sel.id); if(!n){sel=null;return renderProps()}
  let h='';
  if(n.kind==='machine'){ const r=RECIPES[n.recipe];
    const o=x=>`<option value="${esc(x.id)}"${x.id===n.recipe?' selected':''}>${esc(x.name)}</option>`;
    const same=RECIPE_LIST.filter(x=>x.b===r.b);
    const opts=`<optgroup label="Recettes standard">${same.filter(x=>!x.alt).map(o).join('')}</optgroup>`+(same.some(x=>x.alt)?`<optgroup label="Recettes alternatives">${same.filter(x=>x.alt).map(o).join('')}</optgroup>`:'');
    h+=`<h2>${esc(r.b)}${r.alt?'<span class="tag">Alternative</span>':''}</h2><label class="f" for="pRecipe">Recette</label><select id="pRecipe" class="field fw">${opts}</select>`;
  } else if(n.kind==='extractor'){
    const bs=MINERS.includes(n.b)?MINERS:[n.b];
    h+=`<h2>${esc(n.b)}</h2>`;
    if(bs.length>1) h+=`<label class="f" for="pB">Modèle</label><select id="pB" class="field fw">${bs.map(b=>`<option${b===n.b?' selected':''}>${b}</option>`).join('')}</select>`;
    if(MINERS.includes(n.b)||n.b==='Resource Well Extractor') h+=`<label class="f" for="pItem">Ressource</label><select id="pItem" class="field fw">${(n.b==='Resource Well Extractor'?WELL_RES:ORES).map(o=>`<option${o===n.item?' selected':''}>${o}</option>`).join('')}</select>`;
    if(n.b!=='Water Extractor') h+=`<label class="f" for="pPur">Pureté du nœud</label><select id="pPur" class="field fw">${Object.keys(PUR).map(p=>`<option value="${p}"${p===(n.purity||'normal')?' selected':''}>${PURFR[p]}</option>`).join('')}</select>`;
  } else if(n.kind==='source'){
    h+=`<h2>Entrée</h2><p class="hint">Apport venant d'ailleurs (autre usine, train, stockage).</p><label class="f" for="pSrc">Objet</label><select id="pSrc" class="field fw">${ALL_ITEMS.map(i=>`<option${i===n.item?' selected':''}>${esc(i)}</option>`).join('')}</select>
      <label class="f" for="pRate">Débit par minute</label><input id="pRate" type="number" min="0" step="any" class="field fw" value="${n.rate}">`;
  } else {
    h+=`<h2>${LOGI[n.kind]}</h2><p class="hint">${n.kind==='sink'?'Consomme tout ce qui arrive. Sert à marquer les produits finis de l\'usine.':n.kind==='splitter'?'Répartit un flux entre trois sorties selon la demande en aval.':'Réunit jusqu\'à trois flux du même objet.'}</p>`;
  }
  if(n.kind==='machine'||n.kind==='extractor'){
    const P=ports(n), row=(side,i,p)=>`<label class="rrow"><span class="rk">${side==='ins'?'Entrée':'Sortie'}</span>${icon(p.item)}<span class="rn">${esc(p.item)}</span><input class="field num" type="text" inputmode="decimal" data-rate="${side}|${i}" value="${fmtN(p.rate)}" aria-label="${esc(p.item)} par minute"><span class="ru">/min</span></label>`;
    h+=`<label class="f">Débits par minute</label><div class="rates">${P.ins.map((p,i)=>row('ins',i,p)).join('')}${P.outs.map((p,j)=>row('outs',j,p)).join('')}</div>
      <div class="hint" style="margin-top:8px"><b class="num" id="pCountVal" style="color:var(--text)">×${fmtN(n.count)}</b> <span id="pCountHint">${countText(n.count)}</span></div>
      ${n.kind==='machine'?(n.manual?`<div class="hint" style="margin-top:6px">Débits fixés à la main.<br><button class="btn" data-act="auto" style="margin-top:6px">Revenir au calcul automatique</button></div>`:`<div class="hint" style="margin-top:6px">Calculé automatiquement pour produire le maximum en bout de chaîne. Modifiez un débit pour le fixer.</div>`):''}`;
    h+=`<div id="pStats" style="margin-top:12px"></div>`;
  }
  h+=`<div class="actions"><button class="btn" data-act="dup">Dupliquer</button><button class="btn danger" data-act="del">Supprimer</button></div>`;
  el.innerHTML=h; renderStats();
}
function renderStats(){
  const s=$('#pStats'); if(!s||!sel||sel.type!=='node') return; const n=state.nodes.find(x=>x.id===sel.id); if(!n) return;
  const P=R.P[n.id];
  document.querySelectorAll('#props [data-rate]').forEach(inp=>{ if(document.activeElement===inp) return; const [sd,i]=inp.dataset.rate.split('|'); const p=P[sd][+i]; if(p) inp.value=fmtN(p.rate) });
  if($('#pCountVal')){ $('#pCountVal').textContent='×'+fmtN(n.count); $('#pCountHint').textContent=countText(n.count) }
  let h='<div class="kv">';
  P.ins.forEach((p,i)=>{ h+=`<span>Reçu : ${esc(p.item)}</span><span class="${R.sup[n.id][i]<p.rate-0.01?'bad':''}">${fmt(R.sup[n.id][i])} /min</span>` });
  const pwS=power(n); h+=`<span>${pwS<0?'Production':'Consommation'}</span><span>${fmt(Math.abs(pwS))} MW</span></div>`;
  s.innerHTML=h;
}
function refresh(){ solve(); renderNodes(); renderEdges(); renderSummary(); renderStats() }

const catColor=c=>`var(--c-${c||'log'})`;

/* ================= Historique et sauvegarde ================= */
function snap(){ return JSON.stringify(state) }
function pushHist(){ hist.push(snap()); if(hist.length>120) hist.shift(); redo=[]; updUndo() }
function undo(){ if(!hist.length) return; redo.push(snap()); state=JSON.parse(hist.pop()); afterLoad(); changed() }
function redoF(){ if(!redo.length) return; hist.push(snap()); state=JSON.parse(redo.pop()); afterLoad(); changed() }
function updUndo(){ $('#bUndo').disabled=!hist.length; $('#bRedo').disabled=!redo.length }
function afterLoad(){ if(sel){ if(sel.type==='edge'){ if(!state.edges.some(x=>x.id===sel.id)) sel=null } else setSelIds(selIds().filter(id=>state.nodes.some(n=>n.id===id))) }
  migrate(state); $('#fname').value=state.name; refresh(); renderProps(); updUndo() }

let saveTimer=null, saving=false, dirty=false, factories=[], synced=false;
function setStatus(t){ $('#status').textContent=t }
function localAll(){ try{ return JSON.parse(localStorage.getItem('sfp-factories')||'{}')||{} }catch(_){ return {} } }
function localPut(id,doc){ try{ const a=localAll(); a[id]=doc; localStorage.setItem('sfp-factories',JSON.stringify(a)) }catch(_){} }
function localDel(id){ try{ const a=localAll(); delete a[id]; localStorage.setItem('sfp-factories',JSON.stringify(a)) }catch(_){} }
const fcol=()=>db.collection('data/users/'+uid);   // une usine = un document data/users/<id>/<usine>
const online=()=>!!(db&&uid);
function newId(){ return 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6) }
function changed(){
  if(!fid) fid=newId();
  try{ localStorage.setItem('sfp-current',JSON.stringify({fid,state})) }catch(_){}
  dirty=true; setStatus('Modifications en attente…'); clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,1000);
}
async function saveNow(){
  if(saving){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,800); return }
  saving=true; dirty=false; if(!fid) fid=newId();
  const doc={name:state.name||'Sans nom',updatedAt:Date.now(),graph:JSON.stringify(state)};
  localPut(fid,doc);
  if(online()){
    try{ await fcol().doc(fid).set(doc); setStatus('Enregistré dans votre compte') }
    catch(err){ const c=err&&err.code;
      if(c==='invalid_argument'||c==='not_granted'||c==='capability_disabled'){ db=null; setStatus('Enregistré dans ce navigateur') }
      else if(c==='quota_exceeded') setStatus('Espace plein : supprimez une ancienne usine');
      else { setStatus('Échec de l\'enregistrement, nouvel essai bientôt'); dirty=true } }
  } else setStatus('Enregistré dans ce navigateur');
  await loadList(); saving=false;
  if(dirty){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,online()?5000:800) }
}
async function loadList(){
  const map=new Map(Object.entries(localAll()).map(([id,v])=>[id,{id,...v}]));
  if(online()){
    try{ const snap=await fcol().limit(500).get();
      const remote=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
      if(!synced){ synced=true; // envoie les usines créées hors ligne
        for(const [id,l] of map) if(!remote.has(id)){ try{ await fcol().doc(id).set({name:l.name,updatedAt:l.updatedAt,graph:l.graph}) }catch(_){} } }
      for(const [id,r] of remote){ const l=map.get(id); if(!l||(r.updatedAt||0)>=(l.updatedAt||0)) map.set(id,r) }
    }catch(_){}
  }
  factories=[...map.values()].filter(x=>x&&typeof x.graph==='string').sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  renderFList();
}
function renderFList(){
  const f=$('#flist'); f.disabled=false;
  const known=factories.some(x=>x.id===fid);
  const cur=known?'':`<option value="" selected>${esc(state.name)}${state.nodes.length?' (non enregistrée)':''}</option>`;
  f.innerHTML=cur+factories.map(x=>`<option value="${esc(x.id)}"${x.id===fid?' selected':''}>${esc(x.name||'Sans nom')}</option>`).join('')+(known?`<option value="__del">Supprimer l'usine affichée…</option>`:'');
}
$('#flist').addEventListener('change',async e=>{
  const v=e.target.value;
  if(v==='__del'){
    if(fid&&confirm(`Supprimer « ${state.name} » ?`)){ const id=fid; localDel(id); if(online()){ try{ await fcol().doc(id).delete() }catch(_){} }
      fid=null; state=blank(); hist=[];redo=[]; sel=null; afterLoad(); try{localStorage.removeItem('sfp-current')}catch(_){}; await loadList(); setStatus('Usine supprimée') }
    else renderFList();
    return }
  const f=factories.find(x=>x.id===v); if(!f){ renderFList(); return }
  if(dirty){ clearTimeout(saveTimer); await saveNow() }
  try{ state=migrate(Object.assign(blank(),JSON.parse(f.graph))); fid=f.id; hist=[];redo=[]; sel=null; afterLoad(); fitView();
    try{localStorage.setItem('sfp-current',JSON.stringify({fid,state}))}catch(_){} setStatus('Usine ouverte') }
  catch(_){ setStatus('Cette usine est illisible'); renderFList() }
});
$('#bNew').addEventListener('click',async()=>{ if(dirty){ clearTimeout(saveTimer); await saveNow() } fid=null; state=blank(); hist=[];redo=[]; sel=null; view={x:60,y:60,z:1}; applyView(); afterLoad(); renderFList(); setStatus('Nouvelle usine, enregistrée dès la première modification') });
$('#fname').addEventListener('change',e=>{ pushHist(); state.name=e.target.value.trim()||'Sans nom'; changed(); renderFList() });
$('#bUndo').addEventListener('click',undo); $('#bRedo').addEventListener('click',redoF);

$('#bExport').addEventListener('click',async()=>{
  const data=JSON.stringify({format:'satisfactory-planner',version:1,factory:state},null,2);
  const name=(state.name||'usine').replace(/[^\w\- àâçéèêëîïôûùüÿœ]/gi,'').trim()||'usine';
  if(downloads){ try{ await downloads.save({filename:name+'.json',data}); setStatus('Fichier exporté') }catch(err){ if(err&&err.code!=='declined') setStatus('Export impossible ici') } }
  else { try{ await navigator.clipboard.writeText(data); setStatus('JSON copié dans le presse-papiers') }catch(_){ setStatus('Export indisponible dans cette vue') } }
});
$('#bImport').addEventListener('click',()=>$('#fileIn').click());
$('#fileIn').addEventListener('change',async e=>{ const f=e.target.files[0]; if(!f) return;
  try{ const j=JSON.parse(await f.text()); const st=j.factory||j; if(!Array.isArray(st.nodes)||!Array.isArray(st.edges)) throw 0;
    for(const n of st.nodes) if(n.kind==='machine'&&!RECIPES[n.recipe]) throw 0;
    pushHist(); if(dirty){ clearTimeout(saveTimer); await saveNow() } fid=null; state=migrate(Object.assign(blank(),st)); sel=null; afterLoad(); fitView(); changed(); renderFList(); setStatus('Usine importée');
  }catch(_){ setStatus('Fichier non reconnu : choisissez un JSON exporté depuis ce planificateur') }
  e.target.value='';
});

/* ================= Vue : zoom, déplacement ================= */
function toWorld(cx,cy){ const r=canvas.getBoundingClientRect(); return {x:(cx-r.left-view.x)/view.z, y:(cy-r.top-view.y)/view.z} }
function zoomAt(cx,cy,f){ const r=canvas.getBoundingClientRect(); const z=Math.min(2.2,Math.max(0.15,view.z*f)); const k=z/view.z;
  view.x=(cx-r.left)-(cx-r.left-view.x)*k; view.y=(cy-r.top)-(cy-r.top-view.y)*k; view.z=z; applyView() }
canvas.addEventListener('wheel',e=>{ if(e.target.closest('#qm,#zoom')) return; e.preventDefault(); if(e.ctrlKey||Math.abs(e.deltaY)>=Math.abs(e.deltaX)&&!e.shiftKey) zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0015)); else { view.x-=e.deltaX; view.y-=e.deltaY; applyView() } },{passive:false});
function zoomCenter(f){ const r=canvas.getBoundingClientRect(); zoomAt(r.left+r.width/2,r.top+r.height/2,f) }
$('#zIn').addEventListener('click',()=>zoomCenter(1.2)); $('#zOut').addEventListener('click',()=>zoomCenter(1/1.2)); $('#zFit').addEventListener('click',fitView);
function fitView(){ if(!state.nodes.length){ view={x:60,y:60,z:1}; applyView(); return }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const n of state.nodes){ const P=R.P[n.id]; const h=52+24*Math.max(P.ins.length,P.outs.length,1)+22;
    x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+widthOf(n));y1=Math.max(y1,n.y+h) }
  const r=canvas.getBoundingClientRect(), pad=50; const z=Math.min(1.2,Math.max(0.15,Math.min((r.width-pad*2)/(x1-x0),(r.height-pad*2)/(y1-y0))));
  view.z=z; view.x=(r.width-(x1-x0)*z)/2-x0*z; view.y=(r.height-(y1-y0)*z)/2-y0*z; applyView() }

/* ================= Interactions du canevas ================= */
let drag=null; const pts=new Map(); let pinch=null;
canvas.addEventListener('pointerdown',e=>{
  if(e.target.closest('#zoom,#empty,#qm,#legend')) return;
  closeQM();
  if(e.button===2){ canvas.setPointerCapture(e.pointerId); drag={t:'box',sx:e.clientX,sy:e.clientY,moved:false,add:e.shiftKey||e.ctrlKey||e.metaKey,onNode:!!e.target.closest('[data-node]')}; return }
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:view.z}; drag=null; tempWire=''; renderEdges(); return }
  canvas.setPointerCapture(e.pointerId);
  const port=e.target.closest('[data-port]');
  if(port){ const [id,side,i]=port.dataset.port.split('|'); drag={t:'wire',id,side,i:+i,sx:e.clientX,sy:e.clientY,moved:false}; e.preventDefault(); return }
  const nodeEl=e.target.closest('[data-node]');
  if(nodeEl){ const id=nodeEl.dataset.node; const n=state.nodes.find(x=>x.id===id);
    if(e.shiftKey||e.ctrlKey||e.metaKey){ const ids=selIds(); setSelIds(ids.includes(id)?ids.filter(x=>x!==id):[...ids,id]); renderNodes(); renderEdges(); renderProps(); if(!isSel(id)) return }
    else if(!isSel(id)){ sel={type:'node',id}; renderNodes(); renderEdges(); renderProps() }
    const group=state.nodes.filter(x=>isSel(x.id)).map(x=>({n:x,ox:x.x,oy:x.y}));
    drag={t:'node',n,group,sx:e.clientX,sy:e.clientY,moved:false}; return }
  const edge=e.target.closest('[data-edge]');
  if(edge){ sel={type:'edge',id:edge.dataset.edge}; renderNodes(); renderEdges(); renderProps(); if(innerWidth<=860) $('#right').classList.add('open'); return }
  drag={t:'pan',sx:e.clientX,sy:e.clientY,ox:view.x,oy:view.y,moved:false}; canvas.classList.add('panning');
});
canvas.addEventListener('pointermove',e=>{
  lastWorld=toWorld(e.clientX,e.clientY);
  if(pts.has(e.pointerId)) pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); zoomAt((a.x+b.x)/2,(a.y+b.y)/2,(pinch.z*d/pinch.d)/view.z); return }
  if(!drag) return;
  const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy; if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true;
  if(drag.t==='pan'){ view.x=drag.ox+dx; view.y=drag.oy+dy; applyView() }
  else if(drag.t==='node'&&drag.moved){ if(!drag.h){ pushHist(); drag.h=true }
    for(const g of drag.group){ g.n.x=Math.round((g.ox+dx/view.z)/12)*12; g.n.y=Math.round((g.oy+dy/view.z)/12)*12;
      const el=nodesEl.querySelector(`[data-node="${g.n.id}"]`); if(el) el.style.transform=`translate(${g.n.x}px,${g.n.y}px)` }
    renderEdges() }
  else if(drag.t==='box'&&drag.moved){ const r=canvas.getBoundingClientRect(), b=$('#box');
    b.style.display='block'; b.style.left=(Math.min(drag.sx,e.clientX)-r.left)+'px'; b.style.top=(Math.min(drag.sy,e.clientY)-r.top)+'px';
    b.style.width=Math.abs(e.clientX-drag.sx)+'px'; b.style.height=Math.abs(e.clientY-drag.sy)+'px' }
  else if(drag.t==='wire'){ const n=state.nodes.find(x=>x.id===drag.id); const p=portPos(n,drag.side,drag.i); const w=toWorld(e.clientX,e.clientY);
    const c= drag.side==='outs'?curve(p,w):curve(w,p); tempWire=`<path class="temp" d="${c.d}"/>`; renderEdges();
    nodesEl.querySelectorAll('.dot.hot').forEach(d=>d.classList.remove('hot'));
    const t=document.elementFromPoint(e.clientX,e.clientY); const tp=t&&t.closest&&t.closest('[data-port]'); if(tp&&canConnect(drag,tp.dataset.port)) tp.classList.add('hot') }
});
function endPointer(e){
  pts.delete(e.pointerId); if(pts.size<2) pinch=null;
  if(!drag) return; const d=drag; drag=null; canvas.classList.remove('panning');
  if(d.t==='pan'&&!d.moved&&sel){ sel=null; renderNodes(); renderEdges(); renderProps() }
  if(d.t==='box'){ $('#box').style.display='none';
    if(d.moved){ const a=toWorld(Math.min(d.sx,e.clientX),Math.min(d.sy,e.clientY)), b=toWorld(Math.max(d.sx,e.clientX),Math.max(d.sy,e.clientY));
      const hit=state.nodes.filter(n=>{ const el=nodesEl.querySelector(`[data-node="${n.id}"]`); const w=el?el.offsetWidth:widthOf(n), h=el?el.offsetHeight:80;
        return n.x<b.x&&n.x+w>a.x&&n.y<b.y&&n.y+h>a.y }).map(n=>n.id);
      setSelIds(d.add?[...selIds(),...hit]:hit); renderNodes(); renderEdges(); renderProps() }
    else if(e.type==='pointerup'&&!d.onNode) openQM(null,e.clientX,e.clientY) }
  if(d.t==='node'){ if(d.h) changed(); else if(innerWidth<=860&&e.type==='pointerup'&&!e.target.closest('input,select')) $('#right').classList.add('open') }
  if(d.t==='wire'){ tempWire=''; nodesEl.querySelectorAll('.dot.hot').forEach(x=>x.classList.remove('hot'));
    const t=document.elementFromPoint(e.clientX,e.clientY); const tp=t&&t.closest&&t.closest('[data-port]');
    if(tp&&canConnect(d,tp.dataset.port)){ connect(d,tp.dataset.port) }
    else if(d.moved&&e.type==='pointerup'&&t&&canvas.contains(t)&&!tp) openQM(d,e.clientX,e.clientY);
    renderEdges() }
}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
$('#zAdd').addEventListener('click',()=>{ const r=canvas.getBoundingClientRect(); openQM(null,r.left+r.width/2-135,r.top+r.height/2-200) });
canvas.addEventListener('pointerup',endPointer); canvas.addEventListener('pointercancel',endPointer);

function parsePort(s){ const [id,side,i]=s.split('|'); return {id,side,i:+i} }
function canConnect(d,target){ const t=parsePort(target); if(t.id===d.id||t.side===d.side) return false;
  const out= d.side==='outs'?d:t, inp= d.side==='outs'?t:d;
  const a=R.portItem(out.id,'outs',out.i), b=R.portItem(inp.id,'ins',inp.i);
  if(a!=='*'&&b!=='*'&&a!==b) return false;
  return !state.edges.some(e=>e.from===out.id&&e.fp===out.i&&e.to===inp.id&&e.tp===inp.i) }
function connect(d,target){ const t=parsePort(target); const out= d.side==='outs'?d:t, inp= d.side==='outs'?t:d;
  pushHist(); state.edges.push({id:eid(),from:out.id,fp:out.i,to:inp.id,tp:inp.i}); refresh(); renderProps(); changed() }

/* ================= Menu rapide (lâcher un fil dans le vide) ================= */
let qmCtx=null;
const RES=[...ORES,...WELL_RES];
function resEntry(item,well){
  if(well||item==='Nitrogen Gas') return {g:'Ressources brutes',label:item,sub:'Resource Well Extractor',cat:'ext',outs:[item],make:()=>({kind:'extractor',b:'Resource Well Extractor',item,purity:'normal',count:1})};
  if(item==='Water') return {g:'Ressources brutes',label:'Water',sub:'Water Extractor',cat:'ext',outs:['Water'],make:()=>({kind:'extractor',b:'Water Extractor',count:1})};
  if(item==='Crude Oil') return {g:'Ressources brutes',label:'Crude Oil',sub:'Oil Extractor',cat:'ext',outs:['Crude Oil'],make:()=>({kind:'extractor',b:'Oil Extractor',purity:'normal',count:1})};
  return {g:'Ressources brutes',label:item,sub:'Miner',cat:'ext',outs:[item],make:()=>({kind:'extractor',b:'Miner Mk.1',item,purity:'normal',count:1})} }
const recEntry=r=>({g:r.b,label:r.name,sub:r.b,cat:BUILD[r.b].cat,ins:r.ins.map(x=>x[0]),outs:r.outs.map(x=>x[0]),alt:r.alt,make:()=>({kind:'machine',recipe:r.id,count:0,manual:false})});
const logEntry=k=>({g:'Logistique',label:LOGI[k],sub:'',cat:'log',make:()=>k==='source'?{kind:k,item:'Iron Ore',rate:60}:{kind:k}});
function qmCandidates(item,side){
  if(side===null) return [...RES.map(x=>resEntry(x)),resEntry('Water',true),resEntry('Crude Oil',true),...['source','sink','splitter','merger'].map(logEntry),...RECIPE_LIST.map(recEntry)];
  const c=[];
  if(side==='outs'){
    c.push(logEntry('sink'),logEntry('splitter'),logEntry('merger'));
    for(const r of RECIPE_LIST) if(item==='*'||r.ins.some(x=>x[0]===item)) c.push(recEntry(r));
  } else {
    if(item==='*') RES.forEach(x=>c.push(resEntry(x))); else if(RES.includes(item)) c.push(resEntry(item));
    if(['Water','Crude Oil'].includes(item)) c.push(resEntry(item,true));
    for(const r of RECIPE_LIST) if(item==='*'||r.outs.some(x=>x[0]===item)) c.push(recEntry(r));
    c.push({g:'Logistique',label:'Entrée',sub:item==='*'?'Apport externe':item,cat:'log',make:()=>({kind:'source',item:item==='*'?'Iron Ore':item,rate:60})},logEntry('merger'));
  }
  return c;
}
function openQM(d,cx,cy){
  const item=d?R.portItem(d.id,d.side,d.i):null; const cr=canvas.getBoundingClientRect();
  qmCtx={d,item,w:toWorld(cx,cy),list:qmCandidates(item,d?d.side:null)};
  const qm=$('#qm'); qm.classList.add('open');
  qm.style.left=Math.min(cx-cr.left,cr.width-280)+'px'; qm.style.top=Math.max(4,Math.min(cy-cr.top,cr.height-350))+'px';
  $('#qmHead').innerHTML= !d?'Ajouter une ressource ou une machine' : d.side==='outs'?`Que faire avec <b>${esc(item==='*'?'ce flux':item)}</b> ?`:`D'où vient <b>${esc(item==='*'?'ce flux':item)}</b> ?`;
  $('#qmSearch').value=''; renderQM();
  if(!d&&(clip||localStorage.getItem('sfp-clip'))) $('#qmList').insertAdjacentHTML('afterbegin','<button class="pal-item" data-qpaste="1" style="font-weight:600">Coller ici</button>'); if(matchMedia('(pointer:fine)').matches) $('#qmSearch').focus();
}
function renderQM(){ const q=$('#qmSearch').value.toLowerCase();
  let g=null; const grouped=!qmCtx.d;
  $('#qmList').innerHTML=qmCtx.list.map((c,i)=>{ if(q&&!(c.label+' '+c.sub+' '+(c.ins||[]).join(' ')+' '+(c.outs||[]).join(' ')).toLowerCase().includes(q)) return '';
    const head= grouped&&c.g!==g ? `<h3>${esc(g=c.g)}</h3>` : '';
    const ins=(c.ins||[]).map(icon).join(''), outs=(c.outs||[]).map(icon).join('');
    const showSub=!grouped&&c.sub&&c.cat!=='ext';
    const name=esc(c.label)+(c.alt?'<span class="tag">Alt</span>':'')+(showSub?`<div class="hint" style="font-size:11.5px;font-weight:400">${esc(c.sub)}</div>`:'');
    return head+`<button class="qrow${c.alt?' alt':''}" data-qm="${i}"${c.alt?' title="Recette alternative"':''}><span class="qi">${ins}</span><span class="qn">${name}</span><span class="qo">${outs}</span></button>` }).join('')||'<p class="hint" style="padding:6px">Rien ne correspond.</p>' }
function closeQM(){ $('#qm').classList.remove('open'); qmCtx=null }
$('#qmSearch').addEventListener('input',renderQM);
$('#qmSearch').addEventListener('keydown',e=>{ if(e.key==='Escape') closeQM(); if(e.key==='Enter'){ const b=$('#qmList [data-qm]'); if(b) b.click() } });
$('#qmList').addEventListener('click',e=>{ if(e.target.closest('[data-qpaste]')&&qmCtx){ const w=qmCtx.w; closeQM(); pasteClip(w); return }
  const b=e.target.closest('[data-qm]'); if(!b||!qmCtx) return;
  const {d,item,w}=qmCtx; const c=qmCtx.list[+b.dataset.qm]; closeQM();
  pushHist();
  const n=Object.assign({id:nid()},c.make()); const W=widthOf(n);
  n.x=Math.round((!d||d.side==='outs'?w.x:w.x-W)/12)*12; n.y=Math.round((w.y-(d?64:20))/12)*12;
  state.nodes.push(n);
  if(!d){ sel={type:'node',id:n.id}; refresh(); renderProps(); changed(); return }
  const P=ports(n); let port=0;
  if(d.side==='outs'){ const k=P.ins.findIndex(p=>p.item===item||p.item==='*'); port=Math.max(0,k);
    state.edges.push({id:eid(),from:d.id,fp:d.i,to:n.id,tp:port});

  } else { const k=P.outs.findIndex(p=>p.item===item||p.item==='*'); port=Math.max(0,k);
    state.edges.push({id:eid(),from:n.id,fp:port,to:d.id,tp:d.i});
    const tn=state.nodes.find(x=>x.id===d.id); const need=(R.P[d.id].ins[d.i]?.rate||0)-(R.sup[d.id]?.[d.i]||0);
    if(need>0.01&&need!==Infinity&&tn.kind!=='sink'){
      if(n.kind==='machine'){ const per=RECIPES[n.recipe].outs.find(x=>x[0]===item)[1]; n.manual=true; n.count=round4(need/per) }
      else if(n.kind==='extractor') n.count=round4(need/extractorRate(n));
      else if(n.kind==='source') n.rate=round4(need) }
  }
  sel={type:'node',id:n.id}; refresh(); renderProps(); changed();
});
const round4=v=>Math.round(v*1e4)/1e4;

/* ================= Panneau de propriétés ================= */
function curNode(){ return sel&&sel.type==='node'?state.nodes.find(x=>x.id===sel.id):null }
$('#props').addEventListener('change',e=>{
  const n=curNode(), t=e.target;
  if(!n) return;
  pushHist();
  if(t.id==='pRecipe'){ const old=RECIPES[n.recipe]; n.recipe=t.value; const nr=RECIPES[n.recipe];
    state.edges=state.edges.filter(e=>!(e.to===n.id&&(e.tp>=nr.ins.length||nr.ins[e.tp][0]!==old.ins[e.tp]?.[0]))&&!(e.from===n.id&&(e.fp>=nr.outs.length||nr.outs[e.fp][0]!==old.outs[e.fp]?.[0]))) }
  if(t.id==='pB') n.b=t.value;
  if(t.id==='pItem'){ n.item=t.value; state.edges=state.edges.filter(e=>e.from!==n.id) }
  if(t.id==='pPur') n.purity=t.value;
  if(t.id==='pSrc'){ n.item=t.value; state.edges=state.edges.filter(e=>e.from!==n.id) }
  if(t.id==='pRate') n.rate=Math.max(0,+t.value||0);
  if(t.dataset.rate){ const [sd,i]=t.dataset.rate.split('|'); const per=ports({...n,count:1})[sd][+i].rate; const v=parseFloat(t.value.replace(/\s/g,'').replace(',','.'));
    if(per>0&&isFinite(v)&&v>=0){ if(n.kind==='machine') n.manual=true; n.count=round4(v/per) } }
  refresh(); if(t.dataset.rate||['pRecipe','pB','pItem','pPur','pSrc'].includes(t.id)) renderProps(); changed();
});
$('#props').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='del') return deleteSel();
  if(a==='copy') return copySel();
  if(a==='paste') return pasteClip();
  if(a==='dup') return duplicateSel();
  const n=curNode(); if(!n) return;
  if(a==='auto'){ pushHist(); n.manual=false; refresh(); renderProps(); changed() }
});
function copySel(){ const ids=new Set(selIds()); if(!ids.size) return false;
  clip={nodes:JSON.parse(JSON.stringify(state.nodes.filter(n=>ids.has(n.id)))), edges:JSON.parse(JSON.stringify(state.edges.filter(e=>ids.has(e.from)&&ids.has(e.to))))};
  try{ localStorage.setItem('sfp-clip',JSON.stringify(clip)) }catch(_){}
  setStatus(clip.nodes.length>1?`${clip.nodes.length} éléments copiés`:'Élément copié'); if(sel&&sel.type==='multi') renderProps(); return true }
function pasteClip(at){
  if(!clip){ try{ clip=JSON.parse(localStorage.getItem('sfp-clip')||'null') }catch(_){} }
  if(!clip||!clip.nodes.length) return;
  pushHist();
  const x0=Math.min(...clip.nodes.map(n=>n.x)), y0=Math.min(...clip.nodes.map(n=>n.y));
  let t=at||lastWorld; if(!t){ const r=canvas.getBoundingClientRect(); t=toWorld(r.left+r.width/2,r.top+r.height/2) }
  const dx=Math.round((t.x-x0)/12)*12, dy=Math.round((t.y-y0)/12)*12, map={};
  const ns=clip.nodes.map(n=>{ const c=JSON.parse(JSON.stringify(n)); map[n.id]=c.id=nid(); c.x+=dx; c.y+=dy; return c });
  state.nodes.push(...ns);
  for(const e of clip.edges) state.edges.push({...e,id:eid(),from:map[e.from],to:map[e.to]});
  setSelIds(ns.map(n=>n.id)); refresh(); renderProps(); changed();
  setStatus(ns.length>1?`${ns.length} éléments collés`:'Élément collé') }
function duplicateSel(){ const ids=selIds(); if(!ids.length) return; const keep=clip; copySel();
  const ns=state.nodes.filter(n=>ids.includes(n.id)); pasteClip({x:Math.min(...ns.map(n=>n.x))+48,y:Math.min(...ns.map(n=>n.y))+48}); clip=keep||clip }
function deleteSel(){ if(!sel) return; pushHist();
  if(sel.type==='node'||sel.type==='multi'){ const ids=new Set(selIds()); state.nodes=state.nodes.filter(n=>!ids.has(n.id)); state.edges=state.edges.filter(e=>!ids.has(e.from)&&!ids.has(e.to)) }
  else state.edges=state.edges.filter(e=>e.id!==sel.id);
  sel=null; refresh(); renderProps(); changed() }
document.addEventListener('keydown',e=>{
  const typing=e.target.closest&&e.target.closest('input,select,textarea');
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){ e.preventDefault(); e.shiftKey?redoF():undo() }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'&&!typing){ e.preventDefault(); redoF() }
  else if((e.key==='Delete'||e.key==='Backspace')&&!typing&&sel){ e.preventDefault(); deleteSel() }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'&&!typing&&selIds().length){ e.preventDefault(); duplicateSel() }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'&&!typing&&selIds().length){ if(!(window.getSelection&&String(window.getSelection()))){ e.preventDefault(); copySel() } }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'&&!typing){ if(clip||localStorage.getItem('sfp-clip')){ e.preventDefault(); pasteClip() } }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'&&!typing){ e.preventDefault(); setSelIds(state.nodes.map(n=>n.id)); renderNodes(); renderEdges(); renderProps() }
  else if(e.key==='Escape'){ closeQM(); $('#right').classList.remove('open'); if(sel){ sel=null; renderNodes(); renderEdges(); renderProps() } }
});
$('#tglRight').addEventListener('click',()=>$('#right').classList.toggle('open'));

/* ================= Exemple ================= */
function example(){
  const s=blank(); s.name='Plaques de fer renforcées'; let q=1; const id=()=>'n'+(q++);
  const ore={id:id(),kind:'extractor',b:'Miner Mk.1',item:'Iron Ore',purity:'normal',count:2,x:0,y:120};
  const sm={id:id(),kind:'machine',recipe:'Smelter:Iron Ingot',count:4,x:384,y:120};
  const pl={id:id(),kind:'machine',recipe:'Constructor:Iron Plate',count:3,x:768,y:12};
  const rod={id:id(),kind:'machine',recipe:'Constructor:Iron Rod',count:2,x:768,y:228};
  const scr={id:id(),kind:'machine',recipe:'Constructor:Screw',count:3,x:1152,y:228};
  const rip={id:id(),kind:'machine',recipe:'Assembler:Reinforced Iron Plate',count:2,x:1536,y:96};
  const sink={id:id(),kind:'sink',x:1920,y:120};
  s.nodes=[ore,sm,pl,rod,scr,rip,sink];
  const E=(a,fp,b,tp)=>({id:'e'+(q++),from:a.id,fp,to:b.id,tp});
  s.edges=[E(ore,0,sm,0),E(sm,0,pl,0),E(sm,0,rod,0),E(rod,0,scr,0),E(pl,0,rip,0),E(scr,0,rip,1),E(rip,0,sink,0)];
  s.seq=q; return s;
}
$('#bExample').addEventListener('click',()=>{ pushHist(); state=example(); sel=null; afterLoad(); fitView(); changed() });

/* ================= Démarrage ================= */
try{ const c=JSON.parse(localStorage.getItem('sfp-current')||'null'); if(c&&c.state&&Array.isArray(c.state.nodes)){ state=Object.assign(blank(),c.state); fid=c.fid||null } }catch(_){}
afterLoad(); applyView(); requestAnimationFrame(fitView);
setStatus('Enregistré dans ce navigateur');
loadList();
(async()=>{
  if(!window.claude||typeof window.claude.use!=='function') return;
  try{ downloads=await window.claude.use('downloads') }catch(_){}
  try{
    const [u,d]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    const id=u?await u.id():null;
    if(d&&id){ db=d; uid=id; await loadList();
      if(!state.nodes.length&&factories.length&&!factories.some(x=>x.id===fid)){ const f=factories[0]; try{ state=migrate(Object.assign(blank(),JSON.parse(f.graph))); fid=f.id; afterLoad(); fitView(); renderFList() }catch(_){} }
      setStatus('Enregistrement automatique dans votre compte'); }
  }catch(_){}
})();
</script>
